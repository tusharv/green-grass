# One web service and one Postgres database.
# Render Postgres no longer offers a free plan for new databases.
# basic-256mb is the smallest current database plan.
services:
  - type: web
    name: green-grass
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: green-grass-db
          property: connectionString
      - key: OLLAMA_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: green-grass-db
    plan: basic-256mb
    databaseName: greengrass
    user: greengrass
